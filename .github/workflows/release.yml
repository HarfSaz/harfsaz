name: Release (Mac + Windows)

# Builds signed, distributable installers for macOS and Windows when you push a
# version tag (e.g. v1.0.0). Creates a draft GitHub Release with the artifacts.
#
# Secrets to configure in the repo (Settings → Secrets → Actions) — all optional;
# without them the build still runs but produces UNSIGNED artifacts:
#   macOS signing/notarization:
#     APPLE_CERTIFICATE            base64 of your Developer ID .p12
#     APPLE_CERTIFICATE_PASSWORD   password for that .p12
#     APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#     APPLE_ID                     your Apple ID email
#     APPLE_PASSWORD               an app-specific password
#     APPLE_TEAM_ID                your 10-char team id
#   Windows signing (optional):
#     WINDOWS_CERTIFICATE          base64 of your code-signing .pfx
#     WINDOWS_CERTIFICATE_PASSWORD password for that .pfx

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest   # Apple Silicon + Intel via universal
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          # macOS signing + notarization (no-ops if secrets are unset)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (no-ops if unset)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Qalam ${{ github.ref_name }}"
          releaseBody: "Qalam — AI-native Urdu/RTL desktop publishing. See assets below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
