[package]
name = "qalam"
version = "0.1.0"
description = "Qalam — AI-native Urdu Nastaliq desktop publishing"
authors = ["Afzaal Ahmad"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "qalam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nastaliq shaping — rustybuzz is a pure-Rust port of HarfBuzz (no C toolchain needed).
# It includes the same Nastaliq/Arabic complex-shaping logic HarfBuzz uses.
rustybuzz = "0.20"
ttf-parser = "0.25"

# Claude (Anthropic) API bridge
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
