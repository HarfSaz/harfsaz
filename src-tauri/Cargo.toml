[package]
name = "harfsaz"
version = "0.1.0"
description = "Harfsaz — the first open-source, AI-native desktop editor for Nastaʿlīq & RTL scripts (Urdu · Persian · Arabic)"
authors = ["Afzaal Muhammad <afzaal@aiinak.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ahmad641/harfsaz"
edition = "2021"
rust-version = "1.77"

[lib]
name = "harfsaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nastaliq shaping — rustybuzz is a pure-Rust port of HarfBuzz (no C toolchain needed).
# It includes the same Nastaliq/Arabic complex-shaping logic HarfBuzz uses.
rustybuzz = "0.20"
ttf-parser = "0.25"

# Claude (Anthropic) API bridge
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Optimized release builds: smaller, faster binary for distribution.
[profile.release]
opt-level = "s"   # optimize for size
lto = true        # link-time optimization
codegen-units = 1 # better optimization (slower compile)
panic = "abort"   # smaller binary; no unwinding
strip = true      # strip symbols
